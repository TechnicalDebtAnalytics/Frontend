name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - muditha

  pull_request:
    branches:
      - main
      - develop
      - muditha

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build